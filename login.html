<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso de personal · Comedor UCR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
</head>
<body>

  <div class="lock-screen">
    <form class="lock-card" id="lockForm">
      <div class="brand-badge" aria-hidden="true">UCR</div>
      <h1>Acceso de personal</h1>
      <p>Ingresa la clave para administrar el menú del comedor.</p>
      <input type="email" id="lockEmail" placeholder="Correo electrónico" autocomplete="username" required autofocus>
      <input type="password" id="lockPassword" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Entrar</button>
      <p class="lock-error" id="lockError" aria-live="polite"></p>
      <a href="index.html" class="back-link">← Volver al menú público</a>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
